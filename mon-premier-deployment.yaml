apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.24
        ports: 
        - containerPort: 80

# Commande utiliser pour cette partie : 

# kubectl apply -f mon-premier-deployment.yaml -> pour exécuter le fichier yaml et créer le déploiement

# kubectl get all -> pour récupérer les informations sur tout les objets du cluster (pods, services, deployments, etc.)

# kubectl get pods --show-labels -> pour visualiser les hash labels des pods et vérifier que les pods ont bien été créés avec le label "app: nginx"

# kubectl get rs --show-labels -> pour visualiser les hash labels des ReplicaSets et vérifier que les ReplicaSets ont bien été créés avec le label "app: nginx"

# kubectl describe deployments -> pour obtenir des informations détaillées sur le déploiement, y compris l'état actuel, les événements et les stratégies de mise à jour.

# kubectl rollout status deployment/nginx-deployment -> pour vérifier si une mise à jour du déploiement est en cours et si elle a été réussie. 

# kubectl annotate deployments nginx-deployment kubernetes.io/change-cause="Use image 1.24" -> pour ajouter une annotation au déploiement afin de documenter la raison du changement, dans ce cas, l'utilisation de l'image nginx:1.24.

# kubectl rollout history deployment/nginx-deployment -> pour afficher l'historique des révisions du déploiement, y compris les annotations et les changements effectués.

# kubectl rollout history deployment/nginx-deployment --revision=3 -> pour afficher les détails d'une révision spécifique du déploiement, dans ce cas, la révision 3.

# kubectl rollout undo deployment/nginx-deployment --to-revision=2 -> pour revenir à une révision précédente du déploiement, dans ce cas, la révision 2.